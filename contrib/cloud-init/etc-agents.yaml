#cloud-config
# Writes /etc/agents at first boot. Add this to the user data of an
# instance or merge it into your existing cloud-config.
write_files:
  - path: /etc/agents
    owner: root:root
    permissions: "0644"
    content: |
      # web-3.example.net

      ## Role
      nginx reverse proxy for the public website. Production.
      One of four behind a load balancer.

      ## Owner
      Team web-platform. On-call: #web-oncall.

      ## Do not
      - Do not `systemctl restart nginx`. A restart drops open connections.
        Use `nginx -t` and then `systemctl reload nginx`.

      ## Change process
      This instance is built from user data. To change it, change the
      template and replace the instance.

  - path: /etc/agents.d/90-site.md
    owner: root:root
    permissions: "0644"
    content: |
      ## Site rules
      Change freeze from 20 December to 5 January.
